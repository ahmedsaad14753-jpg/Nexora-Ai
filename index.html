<style>
:root{--bg-base:#020205;--panel-bg:rgba(15,15,20,.7);--border-color:rgba(0,210,255,.15);--accent:#00d2ff;--accent-glow:rgba(0,210,255,.4);--text-main:#e2e8f0;--text-muted:#9ca3af;--user-bubble:rgba(255,255,255,.1);--sidebar-bg:rgba(10,10,15,.85)}
[data-theme="light"]{--bg-base:#f0f4f8;--panel-bg:rgba(255,255,255,.85);--border-color:rgba(0,0,0,.1);--accent:#0077b6;--accent-glow:rgba(0,119,182,.3);--text-main:#1e293b;--text-muted:#64748b;--user-bubble:rgba(0,0,0,.05);--sidebar-bg:rgba(255,255,255,.95)}
*{font-family:'Cairo',sans-serif;box-sizing:border-box;-webkit-tap-highlight-color:transparent;scrollbar-width:thin;scrollbar-color:var(--accent) transparent}
body{background-color:var(--bg-base);color:var(--text-main);margin:0;overflow:hidden;background-image:radial-gradient(circle at 15% 50%,var(--accent-glow),transparent 40%),radial-gradient(circle at 85% 30%,var(--accent-glow),transparent 40%);background-size:100% 100%;background-position:center center;transition:background-color .3s,color .3s}
.glass{background:var(--panel-bg);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--border-color);box-shadow:0 8px 32px 0 rgba(0,0,0,.1);transition:all .2s ease}
.glass-sidebar{background:var(--sidebar-bg);backdrop-filter:blur(25px);border-left:1px solid var(--border-color);transition:all .3s ease}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--accent);border-radius:10px}
.fade-up{animation:fadeUp .3s cubic-bezier(.16,1,.3,1) forwards}@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.typing-dot{width:6px;height:6px;background:var(--accent);border-radius:50%;animation:bounce 1.2s infinite ease-in-out both;box-shadow:0 0 8px var(--accent)}.typing-dot:nth-child(1){animation-delay:-.32s}.typing-dot:nth-child(2){animation-delay:-.16s}@keyframes bounce{0%,80%,100%{transform:scale(0)}40%{transform:scale(1)}}
@keyframes pulse-ring{0%{transform:scale(.8);box-shadow:0 0 0 0 var(--accent-glow)}70%{transform:scale(1);box-shadow:0 0 0 10px transparent}100%{transform:scale(.8);box-shadow:0 0 0 0 transparent}}
.recording-pulse{animation:pulse-ring 1.5s infinite;background-color:var(--accent)!important;color:#000!important}
@keyframes pulseGlow{0%,100%{box-shadow:0 0 10px var(--accent-glow)}50%{box-shadow:0 0 25px var(--accent-glow)}}.btn-glow{animation:pulseGlow 2s infinite ease-in-out}
.prose pre{background:#0d0d12!important;border:1px solid var(--border-color);border-radius:10px;padding:0!important;direction:ltr;text-align:left;overflow:hidden;margin:10px 0;position:relative}
.prose pre .code-header{display:flex;justify-content:space-between;align-items:center;padding:6px 12px;background:rgba(255,255,255,.03);border-bottom:1px solid var(--border-color);font-size:11px;color:#888;font-family:'Cairo',sans-serif}
.prose pre .code-header .lang-tag{color:var(--accent);font-weight:bold;text-transform:uppercase}
.prose pre .code-header .copy-btn{cursor:pointer;padding:2px 8px;border-radius:4px;background:rgba(0,210,255,.1);color:var(--accent);font-size:11px;font-weight:bold;transition:all .2s;border:1px solid transparent}
.prose pre .code-header .copy-btn:hover{background:var(--accent);color:#000}
.prose pre .code-header .copy-btn.copied{background:#22c55e;color:#fff}
.prose pre code{display:block;padding:12px;background:transparent!important;color:#e2e8f0;font-family:'Fira Code',monospace!important;font-size:13px;line-height:1.6;overflow-x:auto}
.prose code:not(pre code){background:rgba(0,210,255,.15);padding:2px 5px;border-radius:4px;font-size:.85em;color:var(--accent);direction:ltr;display:inline-block;font-family:'Fira Code',monospace!important}
.prose p{margin-bottom:.6rem;line-height:1.7;font-size:.95rem}.prose p:last-child{margin-bottom:0}.prose strong{color:var(--accent);font-weight:800}.prose ul,.prose ol{padding-right:1.2rem;margin-bottom:.6rem}.prose li{margin-bottom:.3rem}
textarea:focus{outline:none}.input-wrapper:focus-within{border-color:var(--accent);box-shadow:0 0 20px var(--accent-glow);background:var(--panel-bg)}
.agent-btn{transition:all .2s;border:1px solid var(--border-color);color:var(--text-muted)}.agent-btn:hover{border-color:var(--accent);color:var(--accent)}.agent-btn.active{background:var(--accent);color:#000;border-color:var(--accent);box-shadow:0 0 15px var(--accent-glow)}
@media(max-width:640px){.prose p{font-size:.9rem}.prose pre{padding:8px}}
</style>
</head>

<script type="module">

const Crypto={async getKey(){if(this._key)return this._key;const fp=navigator.userAgent+navigator.language+screen.colorDepth+screen.width,enc=new TextEncoder(),keyMat=await crypto.subtle.importKey('raw',enc.encode(fp+'Nexora_Salt_2024'),{name:'PBKDF2'},!1,['deriveKey']);return this._key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:enc.encode('NexoraAI'),iterations:1e4,hash:'SHA-256'},keyMat,{name:'AES-GCM',length:256},!1,['encrypt','decrypt']),this._key},async encrypt(t){try{const k=await this.getKey(),iv=crypto.getRandomValues(new Uint8Array(12)),c=await crypto.subtle.encrypt({name:'AES-GCM',iv},k,new TextEncoder().encode(t)),b=new Uint8Array(iv.length+c.byteLength);return b.set(iv,0),b.set(new Uint8Array(c),iv.length),btoa(String.fromCharCode(...b))}catch{return null}},async decrypt(b64){try{const k=await this.getKey(),buf=Uint8Array.from(atob(b64),c=>c.charCodeAt(0)),iv=buf.slice(0,12),d=buf.slice(12),p=await crypto.subtle.decrypt({name:'AES-GCM',iv},k,d);return new TextDecoder().decode(p)}catch{return null}}};
async function callGemini(messages,attachedImageBase64=null,agent='nexora-1',lang='ar'){let sys=SYSTEM_PROMPT_BASE+' '+AGENTS[agent].prompt;if(lang!=='ar')sys+=` Respond in ${lang}.`;const contents=messages.map(m=>({role:m.role==='user'?'user':'model',parts:[{text:m.content}]}));if(attachedImageBase64&&contents.length>0){contents[contents.length-1].parts.push({inlineData:{mimeType:"image/jpeg",data:attachedImageBase64.split(',')[1]}})}let lastError=null;for(const model of GEMINI_CONFIG.models){try{const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':GEMINI_CONFIG.key},body:JSON.stringify({systemInstruction:{parts:[{text:sys}]},contents:contents,generationConfig:{temperature:.8,maxOutputTokens:2048}})});if(!res.ok){lastError=`Model ${model} failed: ${res.status}`;continue}const data=await res.json();if(data.candidates&&data.candidates[0].content.parts[0].text)return data.candidates[0].content.parts[0].text}catch(e){lastError=e.message}}throw new Error(lastError||"Server connection failed")}

async init(){const enc=localStorage.getItem('nexora_enc');if(enc){const dec=await Crypto.decrypt(enc);if(dec){try{const parsed=JSON.parse(dec);this.state.chats=parsed.chats||[];this.state.currentId=parsed.current||null}catch(e){}}}const savedTheme=localStorage.getItem('nexora_theme')||'dark';document.body.setAttribute('data-theme',savedTheme);document.getElementById('themeSelect').value=savedTheme;const savedLang=localStorage.getItem('nexora_lang')||'ar';this.currentLang=savedLang;document.getElementById('langSelect').value=savedLang;this.applyLang(savedLang);this.renderHistory();this.renderChat();const fs=localStorage.getItem('nexora_font')||'16';this.applyFontSize(fs);const vo=localStorage.getItem('nexora_voice')==='true';this.voiceOutputEnabled=vo;this.updateVoiceStatus();this.initVoiceRecognition();document.getElementById('modalContainer').addEventListener('click',e=>{if(e.target.id==='modalContainer')this.closeModal()})},

initVoiceRecognition(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(SR){this.recognition=new SR;this.recognition.lang=this.currentLang==='ar'?'ar-EG':'en-US';this.recognition.continuous=!1;this.recognition.interimResults=!0;this.recognition.onstart=()=>{this.isRecording=!0;document.getElementById('micBtn').classList.add('recording-pulse')};this.recognition.onresult=e=>{let t='';for(let i=e.resultIndex;i<e.results.length;i++){if(e.results[i].isFinal)t+=e.results[i][0].transcript}if(t){document.getElementById('userInput').value=t;this.autoGrow(document.getElementById('userInput'))}};this.recognition.onend=()=>{this.isRecording=!1;document.getElementById('micBtn').classList.remove('recording-pulse')};this.recognition.onerror=()=>{this.isRecording=!1;document.getElementById('micBtn').classList.remove('recording-pulse');alert('Microphone error or permission denied.')}}},
toggleVoiceInput(){if(!this.recognition){alert("Your browser does not support voice input. Try Google Chrome.");return}if(this.isRecording)this.recognition.stop();else this.recognition.start()},
toggleVoiceOutput(){this.voiceOutputEnabled=!this.voiceOutputEnabled;localStorage.setItem('nexora_voice',this.voiceOutputEnabled);this.updateVoiceStatus()},
updateVoiceStatus(){document.getElementById('voiceStatus').textContent=this.voiceOutputEnabled?'On':'Off';document.getElementById('voiceOutputBtn').style.color=this.voiceOutputEnabled?'#00d2ff':'#9ca3af'},
speakText(text){if(!this.voiceOutputEnabled)return;window.speechSynthesis.cancel();const cleanText=text.replace(/```[\s\S]*?```/g,' (code) ').replace(/[*#`_]/g,'');const utterance=new SpeechSynthesisUtterance(cleanText);utterance.lang=this.currentLang==='ar'?'ar-SA':'en-US';utterance.rate=1;utterance.pitch=1.1;const voices=window.speechSynthesis.getVoices();const femaleVoice=voices.find(v=>v.lang.includes(this.currentLang)&&(v.name.includes('Female')||v.name.includes('Samantha')))||voices.find(v=>v.lang.includes(this.currentLang));if(femaleVoice)utterance.voice=femaleVoice;window.speechSynthesis.speak(utterance)},

applyLang(lang){this.currentLang=lang;localStorage.setItem('nexora_lang',lang);const t=TRANSLATIONS[lang];if(!t)return;document.querySelectorAll('[data-i18n]').forEach(el=>{const key=el.getAttribute('data-i18n');if(t[key])el.textContent=t[key]});document.querySelectorAll('[data-i18n-placeholder]').forEach(el=>{const key=el.getAttribute('data-i18n-placeholder');if(t[key])el.placeholder=t[key]});document.documentElement.lang=lang;document.documentElement.dir=(lang==='ar')?'rtl':'ltr';if(this.recognition)this.recognition.lang=(lang==='ar')?'ar-EG':'en-US'},

async deleteChat(id,e){e.stopPropagation();if(!confirm('Delete this chat?'))return;this.state.chats=this.state.chats.filter(c=>c.id!==id);if(this.state.currentId===id)this.state.currentId=this.state.chats[0]?.id||null;await this.persist();this.renderHistory();this.renderChat()},
renderHistory(){const list=document.getElementById('historyList');if(this.state.chats.length===0){list.innerHTML='<div class="text-xs text-center text-gray-600 mt-4">No chats yet</div>';return}list.innerHTML=this.state.chats.map(c=>`<div onclick="App.loadChat('${c.id}')" class="group flex items-center gap-2 p-2.5 rounded-lg cursor-pointer transition border border-transparent ${c.id===this.state.currentId?'bg-[#00d2ff]/10 border-[#00d2ff]/30':'hover:bg-white/5'}"><svg class="w-4 h-4 text-gray-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg><span class="text-sm flex-1 truncate text-gray-300">${this.escape(c.title)}</span><div class="flex opacity-0 group-hover:opacity-100 transition"><button onclick="App.deleteChat('${c.id}', event)" class="p-1 hover:text-red-500"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg></button></div></div>`).join('')},
renderChat(){const area=document.getElementById('chatArea');const chat=this.state.chats.find(c=>c.id===this.state.currentId);if(!chat||chat.msgs.length===0){document.getElementById('chatTitle').textContent='Nexora AI';area.innerHTML=`<div class="flex flex-col items-center justify-center h-full text-center fade-up"><div class="w-16 h-16 md:w-20 md:h-20 rounded-2xl bg-gradient-to-tr from-[#00d2ff] to-[#3a7bd5] flex items-center justify-center mb-4 md:mb-6 shadow-[0_0_40px_var(--accent-glow)] btn-glow"><svg class="w-8 h-8 md:w-10 md:h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg></div><h2 class="text-xl md:text-3xl font-black mb-2 md:mb-3">Nexora AI</h2><p class="text-gray-400 text-xs md:text-sm max-w-sm">Your advanced AI assistant. Ready for coding, image analysis, and instant answers.</p></div>`;return}document.getElementById('chatTitle').textContent=chat.title;area.innerHTML='';chat.msgs.forEach(m=>this.appendBubble(m.role,m.content,m.image,!1));area.scrollTop=area.scrollHeight},
appendBubble(role,text,imageBase64=null,animate=!0){const area=document.getElementById('chatArea');const isUser=role==='user';const div=document.createElement('div');div.className=`flex gap-1.5 md:gap-3 ${animate?'fade-up':''} ${isUser?'flex-row-reverse':''}`;const avatar=isUser?`<div class="w-7 h-7 md:w-10 md:h-10 rounded-lg md:rounded-xl bg-white/5 border border-white/10 flex items-center justify-center flex-shrink-0"><svg class="w-3 h-3 md:w-5 md:h-5 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg></div>`:`<div class="w-7 h-7 md:w-10 md:h-10 rounded-lg md:rounded-xl bg-gradient-to-tr from-[#00d2ff] to-[#3a7bd5] flex items-center justify-center flex-shrink-0 shadow-[0_0_15px_var(--accent-glow)]"><svg class="w-3 h-3 md:w-5 md:h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg></div>`;let imageHtml='';if(imageBase64){imageHtml=`<img src="${imageBase64}" class="mt-2 rounded-lg max-h-48">`}const bubble=isUser?`<div class="max-w-[88%] md:max-w-[75%] bg-white/10 border border-white/5 px-3 py-2 md:px-4 md:py-3 rounded-xl md:rounded-2xl rounded-tr-sm text-xs md:text-base whitespace-pre-wrap text-gray-100">${this.escape(text)}${imageHtml}</div>`:`<div class="max-w-[88%] md:max-w-[75%] glass border border-[var(--border-color)] px-3 py-2 md:px-4 md:py-3 rounded-xl md:rounded-2xl rounded-tl-sm text-xs md:text-base prose shadow-lg">${this.markdown(text)}</div>`;div.innerHTML=avatar+bubble;area.appendChild(div);if(!isUser)this.highlightCodes(div);area.scrollTop=area.scrollHeight},
highlightCodes(container){container.querySelectorAll('pre').forEach(pre=>{const codeEl=pre.querySelector('code');if(!codeEl)return;const rawCode=codeEl.textContent;const lang=codeEl.className.replace('language-','').split(' ')[0]||'plaintext';const header=document.createElement('div');header.className='code-header';header.innerHTML=`<span class="lang-tag">${lang}</span><button class="copy-btn" onclick="App.copyCode(this)">📋 Copy</button>`;pre.insertBefore(header,codeEl);pre.removeChild(codeEl);const newCode=document.createElement('code');newCode.textContent=rawCode;newCode.className='hljs language-'+lang;pre.appendChild(newCode);try{hljs.highlightElement(newCode)}catch(e){}})},
copyCode(btn){const pre=btn.closest('pre');const code=pre.querySelector('code');navigator.clipboard.writeText(code.textContent).then(()=>{btn.textContent='✓ Copied!';btn.classList.add('copied');setTimeout(()=>{btn.textContent='📋 Copy';btn.classList.remove('copied')},2000)}).catch(()=>{const ta=document.createElement('textarea');ta.value=code.textContent;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);btn.textContent='✓ Copied!';btn.classList.add('copied');setTimeout(()=>{btn.textContent='📋 Copy';btn.classList.remove('copied')},2000)})},
async sendMessage(){if(this.state.generating)return;const input=document.getElementById('userInput');const text=input.value.trim();if(!text&&!this.attachedImage)return;if(!this.state.currentId){const id='c_'+Date.now();this.state.chats.unshift({id,title:text.substring(0,30)||'Image',msgs:[]});this.state.currentId=id}const chat=this.state.chats.find(c=>c.id===this.state.currentId);if(chat.msgs.length===0){chat.title=text.substring(0,30)||'Image Analysis';this.renderHistory();document.getElementById('chatTitle').textContent=chat.title}const currentImage=this.attachedImage;chat.msgs.push({role:'user',content:text,image:currentImage});this.appendBubble('user',text,currentImage);input.value='';input.style.height='auto';this.clearAttachedImage();await this.persist();this.state.generating=!0;document.getElementById('sendBtn').disabled=!0;const area=document.getElementById('chatArea');const typingId='typing_'+Date.now();const typingDiv=document.createElement('div');typingDiv.id=typingId;typingDiv.className='flex gap-1.5 md:gap-3 fade-up';typingDiv.innerHTML=`<div class="w-7 h-7 md:w-10 md:h-10 rounded-lg md:rounded-xl bg-gradient-to-tr from-[#00d2ff] to-[#3a7bd5] flex items-center justify-center flex-shrink-0"><svg class="w-3 h-3 md:w-5 md:h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg></div><div class="glass px-3 py-2 md:px-4 md:py-3 rounded-xl md:rounded-2xl rounded-tl-sm flex items-center gap-1.5"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>`;area.appendChild(typingDiv);area.scrollTop=area.scrollHeight;try{const msgs=chat.msgs.filter(m=>m.role==='user'||m.role==='assistant').map(m=>({role:m.role,content:m.content}));const reply=await callGemini(msgs,currentImage,this.currentAgent,this.currentLang);const typingEl=document.getElementById(typingId);if(typingEl)typingEl.remove();chat.msgs.push({role:'assistant',content:reply});this.appendBubble('assistant',reply);this.speakText(reply);await this.persist()}catch(e){const typingEl=document.getElementById(typingId);if(typingEl)typingEl.remove();const errMsg=`⚠️ Connection error:\n${e.message}`;chat.msgs.push({role:'assistant',content:errMsg});this.appendBubble('assistant',errMsg);await this.persist()}finally{this.state.generating=!1;document.getElementById('sendBtn').disabled=!1;input.focus()}},
escape(text){return text.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))},
markdown(text){let html=this.escape(text);const codeBlocks=[];html=html.replace(/```(\w*)\n?([\s\S]*?)```/g,(m,l,c)=>{const idx=codeBlocks.length;codeBlocks.push({lang:l||'plaintext',code:c.trim()});return `\n\n__CODEBLOCK_${idx}__\n\n`});html=html.replace(/`([^`]+)`/g,'<code>$1</code>');html=html.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');html=html.replace(/^\* (.+)$/gm,'<li>$1</li>');html=html.replace(/(<li>.*<\/li>)/s,'<ul>$1</ul>');html=html.split('\n\n').map(p=>{if(p.match(/^<(h[1-3]|ul|pre|ol)/))return p;if(p.match(/^__CODEBLOCK_\d+__$/))return p;return p.trim()?`<p>${p}</p>`:''}).join('');codeBlocks.forEach((block,i)=>{const escapedCode=this.escape(block.code);html=html.replace(`__CODEBLOCK_${i}__`,`<pre><code class="language-${block.lang}">${escapedCode}</code></pre>`)});return html},
autoGrow(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,128)+'px'},
handleKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();this.sendMessage()}},
openModal(name){document.getElementById('modalContainer').classList.remove('hidden');document.getElementById('modalContainer').classList.add('flex');document.querySelectorAll('.modal-content').forEach(m=>m.classList.add('hidden'));document.getElementById('modal-'+name).classList.remove('hidden')},
closeModal(){document.getElementById('modalContainer').classList.add('hidden');document.getElementById('modalContainer').classList.remove('flex')},
async notebookAction(action){const text=document.getElementById('noteInput').value.trim();if(!text)return alert('Write a note first');const resBox=document.getElementById('noteResult');resBox.classList.remove('hidden');resBox.innerHTML='<span class="text-gray-400">Processing...</span>';const prompts={summarize:`Summarize the following text in clear bullet points:\n\n${text}`,improve:`Improve the following text to be more professional:\n\n${text}`,expand:`Expand the following text with additional ideas:\n\n${text}`};try{const reply=await callGemini([{role:'user',content:prompts[action]}],null,this.currentAgent,this.currentLang);resBox.innerHTML=this.markdown(reply)}catch(e){resBox.innerHTML=`<span class="text-red-400">Error: ${e.message}</span>`}},
_imgObj:null,loadImage(e){const file=e.target.files[0];if(!file)return;const reader=new FileReader;reader.onload=ev=>{const img=new Image;img.onload=()=>{this._imgObj=img;document.getElementById('previewImg').src=ev.target.result;document.getElementById('imagePreview').classList.remove('hidden');document.getElementById('widthInput').placeholder=img.width};img.src=ev.target.result};reader.readAsDataURL(file)},
updateQuality(val){document.getElementById('qualityVal').textContent=val},
compressImage(){if(!this._imgObj)return;const q=parseInt(document.getElementById('qualityRange').value)/100;let w=parseInt(document.getElementById('widthInput').value)||this._imgObj.width;const h=Math.round(w*(this._imgObj.height/this._imgObj.width));const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;canvas.getContext('2d').drawImage(this._imgObj,0,0,w,h);canvas.toBlob(blob=>{const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`nexora-${Date.now()}.jpg`;a.click();document.getElementById('imageInfo').textContent=`Size: ${(blob.size/1024).toFixed(1)} KB`},'image/jpeg',q)},
applyFontSize(size){document.documentElement.style.fontSize=size+'px';localStorage.setItem('nexora_font',size)},
async clearData(){if(!confirm('Delete all history permanently?'))return;localStorage.removeItem('nexora_enc');this.state.chats=[];this.state.currentId=null;this.renderHistory();this.renderChat();this.closeModal()}};
window.App=App;
</script>
